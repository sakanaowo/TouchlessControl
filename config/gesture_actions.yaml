# Gesture → OS action mapping — Milestone 2 (Mouse Control)
# on_start: action triggered when gesture is ACTIVATED (event_type == 'start')
# repeat: true  → also fires on 'hold' event (every debounce_seconds while gesture is held)
# repeat: false → one-shot only ('hold' events ignored)
#
# on_start types:
#   key_press   → single key via pynput / ydotool
#   key_combo   → multi-key chord (e.g. Alt+Tab)
#   mouse_click → left / right / middle
#   mouse_drag  → press on start, release on end
#   scroll      → up / down with configurable amount
#
# NOTE: pointer_move and scroll_mode are handled as continuous modes
# in app.py (bypass GestureStateMachine). They are NOT listed here.

# null: no action
# pointer_move: continuous cursor control (bypass)
# scroll_mode: continuous scroll (bypass)

left_click:
  on_start: mouse_click
  button: left
  repeat: false

drag_hold:
  on_start: mouse_drag
  button: left
  repeat: false
